<div class="code-editor">
  <div class="code-editor__toolbar">
    <label class="code-editor__field">
      <span class="code-editor__label">Language</span>
      <select
        class="code-editor__select"
        [value]="language()"
        [disabled]="readOnly() || !ready()"
        (change)="onLanguageChange($event)"
      >
        @for (option of languages; track option.id) {
          <option [value]="option.id">{{ option.label }}</option>
        }
      </select>
    </label>

    <div class="code-editor__actions">
      <button
        type="button"
        class="code-editor__btn"
        [disabled]="readOnly() || !ready()"
        (click)="formatDocument()"
      >
        Format
      </button>
      <button
        type="button"
        class="code-editor__btn"
        [disabled]="readOnly() || !ready() || addingFile()"
        (click)="startAddFile()"
      >
        Add file
      </button>
      <ng-content select="[editorActions]" />
    </div>
  </div>

  <div class="code-editor__tabs" role="tablist" aria-label="Solution files">
    @for (file of files(); track file.id) {
      <button
        type="button"
        class="code-editor__tab"
        role="tab"
        [class.is-active]="file.id === activeFileId()"
        [attr.aria-selected]="file.id === activeFileId()"
        (click)="selectFile(file.id)"
      >
        <span class="code-editor__tab-name">{{ file.name }}</span>
        @if (files().length > 1 && !readOnly()) {
          <span
            class="code-editor__tab-close"
            role="button"
            tabindex="0"
            aria-label="Close {{ file.name }}"
            (click)="removeFile(file.id, $event)"
            (keydown.enter)="removeFile(file.id, $event)"
            (keydown.space)="removeFile(file.id, $event); $event.preventDefault()"
          >
            ×
          </span>
        }
      </button>
    }
  </div>

  @if (addingFile()) {
    <div class="code-editor__new-file">
      <label class="code-editor__field code-editor__field--grow">
        <span class="code-editor__label">New file name</span>
        <input
          class="code-editor__input"
          type="text"
          [value]="newFileName()"
          (input)="onNewFileNameInput($event)"
          (keydown.enter)="confirmAddFile()"
          (keydown.escape)="cancelAddFile()"
          placeholder="utils.py"
        />
      </label>
      <div class="code-editor__actions">
        <button type="button" class="code-editor__btn code-editor__btn--primary" (click)="confirmAddFile()">
          Create
        </button>
        <button type="button" class="code-editor__btn" (click)="cancelAddFile()">Cancel</button>
      </div>
    </div>
  }

  @if (loadError()) {
    <p class="code-editor__error" role="alert">{{ loadError() }}</p>
  } @else if (!ready()) {
    <p class="code-editor__loading" role="status">Loading editor…</p>
  }

  <div
    #host
    class="code-editor__host"
    [class.is-ready]="ready()"
    role="textbox"
    aria-label="Code editor"
  ></div>
</div>
