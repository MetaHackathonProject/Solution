name: Frontend

on:
  workflow_call:
    inputs:
      deploy:
        description: Upload the build to S3. Pull requests build only.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          COGNITO_AUTHORITY: ${{ secrets.COGNITO_AUTHORITY }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
        run: npm run build

      - name: Configure AWS credentials
        if: inputs.deploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: eu-central-1

      - name: Deploy to S3
        if: inputs.deploy
        run: aws s3 sync dist/Frontend/browser s3://hackathon-solution-hosting-bucket --delete

      - name: Invalidate CloudFront cache
        if: inputs.deploy
        run: |
          set -euo pipefail
          distribution_id="$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Aliases.Items, 'hackathon-solution.com')].Id | [0]" --output text)"
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths "/*"
